{{- if ne (include "install-operators.namespaceHasOperatorGroup" .Values.operatorNamespace | trim) "true" }}
apiVersion: operators.coreos.com/v1
kind: OperatorGroup
metadata:
  name: openshift-cert-manager-operator
  namespace: {{ .Values.operatorNamespace }}
spec:
  # cert-manager Operator 1.15+ uses AllNamespaces (omit targetNamespaces).
  upgradeStrategy: Default
{{- end }}
