global:
  cluster:
    name: cluster
    baseDomain: example.com

# Disconnected cluster workaround (CONNLINK-805): optional per cluster via cluster.yaml.
# Gateway ConfigMap is always created (2Gi istio-proxy). WASM env is added only when enabled.
disconnected:
  enabled: false
  gatewayConfig:
    name: maas-gateway-options
    namespace: openshift-ingress
    wasmInsecureRegistries: ""
    # ClusterIP so the OpenShift Route is the only external entry (no extra LB).
    serviceType: ClusterIP
    # OpenShift service-ca Secret name for Gateway HTTPS (must match listener certificateRefs).
    # Leave empty when using the IngressController wildcard cert (passthrough Route).
    servingCertSecretName: ""
    istioProxy:
      resources:
        requests:
          cpu: 100m
          memory: 256Mi
        limits:
          cpu: "2"
          memory: 2Gi

# IngressController defaultCertificate (wildcard *.apps). Override per cluster.
ingressCertificate:
  secretName: router-certs-default

gatewayClasses:
  openshift-default:
    controllerName: openshift.io/gateway-controller/v1

gateways:
  maas-default-gateway:
    namespace: openshift-ingress
    gatewayClassName: openshift-default
    metadata:
      annotations:
        opendatahub.io/managed: "false"
        security.opendatahub.io/authorino-tls-bootstrap: "true"
      labels:
        app.kubernetes.io/component: gateway
        app.kubernetes.io/instance: maas-default-gateway
        app.kubernetes.io/name: maas
        istio.io/rev: openshift-gateway
        opendatahub.io/managed: "false"
    listeners:
      http:
        hostname: "maas.apps.{{ .Values.global.cluster.name }}.{{ .Values.global.cluster.baseDomain }}"
        port: 80
        protocol: HTTP
        allowedRoutes:
          namespaces:
            from: Selector
            selector:
              matchLabels:
                maas.opendatahub.io/gateway-access: "true"
      https:
        hostname: "maas.apps.{{ .Values.global.cluster.name }}.{{ .Values.global.cluster.baseDomain }}"
        port: 443
        protocol: HTTPS
        allowedRoutes:
          namespaces:
            from: Selector
            selector:
              matchLabels:
                maas.opendatahub.io/gateway-access: "true"
        tls:
          mode: Terminate
          certificateRefs:
            - group: ""
              kind: Secret
              name: router-certs-default
        certificate:
          create: false
          secretName: router-certs-default
          issuerRef:
            group: cert-manager.io
            kind: ClusterIssuer
            name: venafi-tpp-cluster-issuer
          dnsNames: []
          commonName: ""  # defaults to listener hostname when empty
          duration: ""    # Venafi TPP policy may require exactly 17520h (2 years)
          renewBefore: ""
          usages: []
          subject: {}
          privateKey: {}
          annotations: {}
          labels: {}

# Optional OpenShift Route for external MaaS access (HAProxy layer).
# Disabled by default — enable when you want Helm to manage the Route instead of creating it manually.
# Uses streaming-friendly HAProxy annotations (long timeout, forwarded headers).
route:
  create: false
  name: maas-default-gateway
  hostname: ""  # default: maas.apps.{cluster.name}.{cluster.baseDomain}
  # Service created by the OpenShift Gateway controller; override if auto-discovery differs.
  serviceName: maas-default-gateway-openshift-default
  targetPort: https
  timeout: 10m
  forwardedHeaders: append
  annotations: {}
  tls:
    termination: passthrough
    insecureEdgeTerminationPolicy: Redirect
