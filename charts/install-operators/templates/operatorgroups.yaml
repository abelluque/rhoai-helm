{{- range $operator, $config := .Values.operators }}
{{- if $config.namespace }}
{{- if $config.operatorGroup }}
{{- if $config.operatorGroup.enabled }}
{{- $namedOg := lookup "operators.coreos.com/v1" "OperatorGroup" $config.namespace $operator }}
{{- $nsHasOg := eq (include "install-operators.namespaceHasOperatorGroup" $config.namespace | trim) "true" }}
{{- /* Keep rendering a Helm-owned OG so upgrades do not delete it. Skip only when
     a *different* OG already exists (RHDP) and ours is not in the cluster. */}}
{{- if or $namedOg (not $nsHasOg) }}
---
apiVersion: operators.coreos.com/v1
kind: OperatorGroup
metadata:
  name: {{ $operator }}
  namespace: {{ $config.namespace }}
  labels:
    {{- include "install-operators.labels" $ | nindent 4 }}
spec:
  upgradeStrategy: {{ $config.operatorGroup.upgradeStrategy | default "Default" }}
  {{- with $config.targetNamespaces }}
  targetNamespaces:
    {{- toYaml . | nindent 4 }}
  {{- end }}
{{- end }}
{{- end }}
{{- end }}
{{- end }}
{{- end }}
