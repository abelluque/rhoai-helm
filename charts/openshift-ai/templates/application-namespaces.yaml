{{- with .Values.dataScienceClusterInitialization }}
{{- /* applicationsNamespace is created by wave 4 (maas-postgres --create-namespace) or by the
     DSCInitialization operator; do not create it here — a Namespace in this release would
     fight Helm ownership with maas-postgres and leave the ns Terminating.

     monitoring.namespace is a regular resource (not a pre-install hook) so wave 5
     helm --no-hooks can apply patch-controller-resources RBAC. Skip if the NS already
     exists and is not owned by this release (prior hook / DSCI). */}}
{{- if and .monitoring.namespace (eq (include "install-operators.shouldRenderNamespace" (dict "ns" .monitoring.namespace "root" $) | trim) "true") }}
apiVersion: v1
kind: Namespace
metadata:
  name: {{ .monitoring.namespace }}
  labels:
    {{- include "openshift-ai.labels" $ | nindent 4 }}
{{- end }}
{{- end }}
