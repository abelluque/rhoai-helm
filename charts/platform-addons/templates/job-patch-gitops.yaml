{{- if .Values.gitops.patchNodePlacement }}
apiVersion: v1
kind: ServiceAccount
metadata:
  name: patch-gitops-placement
  namespace: {{ .Values.gitops.argocdNamespace }}
---
apiVersion: rbac.authorization.k8s.io/v1
kind: Role
metadata:
  name: patch-gitops-placement
  namespace: {{ .Values.gitops.argocdNamespace }}
rules:
  - apiGroups: ["argoproj.io"]
    resources: ["argocds"]
    verbs: ["get", "list", "patch", "update"]
---
apiVersion: rbac.authorization.k8s.io/v1
kind: RoleBinding
metadata:
  name: patch-gitops-placement
  namespace: {{ .Values.gitops.argocdNamespace }}
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: Role
  name: patch-gitops-placement
subjects:
  - kind: ServiceAccount
    name: patch-gitops-placement
    namespace: {{ .Values.gitops.argocdNamespace }}
---
apiVersion: v1
kind: ConfigMap
metadata:
  name: patch-gitops-placement-script
  namespace: {{ .Values.gitops.argocdNamespace }}
data:
  argocd-patch.yaml: |
    spec:
      nodePlacement:
        nodeSelector:
          {{- .Values.scheduling.platform.nodeSelector | toYaml | nindent 10 }}
      extraConfig:
        resource.customizations.health.PersistentVolumeClaim: |
          hs = {}
          if obj.status == nil then
            hs.status = "Healthy"
            hs.message = "No status"
            return hs
          end
          if obj.status.phase == "Bound" then
            hs.status = "Healthy"
            hs.message = "PVC is Bound"
            return hs
          end
          if obj.status.phase == "Lost" then
            hs.status = "Degraded"
            hs.message = "PVC is Lost"
            return hs
          end
          if obj.status.phase == "Pending" then
            local anns = {}
            if obj.metadata ~= nil and obj.metadata.annotations ~= nil then
              anns = obj.metadata.annotations
            end
            if anns["volume.beta.kubernetes.io/storage-provisioner"] == nil and anns["volume.kubernetes.io/storage-provisioner"] == nil then
              hs.status = "Healthy"
              hs.message = "Waiting for first consumer"
              return hs
            end
            if obj.status.conditions ~= nil then
              for i, c in ipairs(obj.status.conditions) do
                if c.reason == "WaitForFirstConsumer" then
                  hs.status = "Healthy"
                  hs.message = "Waiting for first consumer"
                  return hs
                end
              end
            end
            hs.status = "Progressing"
            hs.message = "PVC is not yet Bound"
            return hs
          end
          hs.status = "Unknown"
          hs.message = obj.status.phase
          return hs
  patch.sh: |
    #!/bin/bash
    set -euo pipefail
    NS="{{ .Values.gitops.argocdNamespace }}"
    NAME="{{ .Values.gitops.argocdName }}"
    echo "Waiting for ArgoCD/${NAME}..."
    until oc get argocd "${NAME}" -n "${NS}" >/dev/null 2>&1; do sleep 10; done
    oc patch argocd "${NAME}" -n "${NS}" --type merge --patch-file /scripts/argocd-patch.yaml
    echo "Patched ArgoCD nodePlacement and PVC health check"
---
apiVersion: batch/v1
kind: Job
metadata:
  name: patch-gitops-argocd
  namespace: {{ .Values.gitops.argocdNamespace }}
  annotations:
    helm.sh/hook: post-install,post-upgrade
    helm.sh/hook-delete-policy: before-hook-creation
    helm.sh/hook-weight: "5"
    argocd.argoproj.io/sync-wave: "0"
spec:
  backoffLimit: 12
  template:
    spec:
      serviceAccountName: patch-gitops-placement
      restartPolicy: Never
      nodeSelector:
        {{- include "platform-addons.platformNodeSelector" . | nindent 8 }}
      containers:
        - name: patch
          image: {{ .Values.global.toolsImage }}
          command: ["/scripts/patch.sh"]
          volumeMounts:
            - name: scripts
              mountPath: /scripts
      volumes:
        - name: scripts
          configMap:
            name: patch-gitops-placement-script
            defaultMode: 493
{{- end }}
