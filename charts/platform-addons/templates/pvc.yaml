{{- range $key, $pvc := .Values.pvcs }}
{{- if $pvc.create }}
---
apiVersion: v1
kind: PersistentVolumeClaim
metadata:
  name: {{ $pvc.name }}
  namespace: {{ $pvc.namespace }}
  annotations:
    argocd.argoproj.io/ignore-healthcheck: "true"
  labels:
    {{- include "platform-addons.labels" $ | nindent 4 }}
    platform-addons.rhoai.io/pvc: {{ $key }}
spec:
  accessModes:
    - {{ $pvc.accessMode }}
  storageClassName: {{ include "platform-addons.storageClassName" $ }}
  resources:
    requests:
      storage: {{ $pvc.size }}
  volumeMode: Filesystem
{{- end }}
{{- end }}
