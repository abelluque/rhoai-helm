global:
  toolsImage: image-registry.openshift-image-registry.svc:5000/openshift/tools:latest

install-rhcl:
  enabled: true
  operators:
    rhcl-operator:
      channel: stable
      installPlanApproval: Manual
      namespace: kuadrant-system
      operatorGroup:
        enabled: true
      startingCSV: rhcl-operator.v1.3.4

kuadrant:
  create: true
  namespace: kuadrant-system
  spec:
    observability:
      enable: true

authorino:
  overwrite: true
  serviceTls: true
  certSecretName: authorino-server-cert
  # Outbound HTTPS to maas-api (service-ca). Authorino CR has no envVars.
  caBundle:
    enabled: true
    deployment: authorino
    sslCertFile: /etc/ssl/certs/openshift-service-ca/service-ca-bundle.crt
    configMapName: openshift-service-ca.crt
    volumeName: openshift-service-ca
  spec:
    clusterWide: true
    healthz: {}
    listener:
      ports: {}
      tls:
        certSecretRef:
          name: authorino-server-cert
        enabled: true
    oidcServer:
      tls:
        enabled: true
        certSecretRef:
          name: authorino-server-cert

# bootstrap.sh: patch RHCL CSV ISTIO_GATEWAY_CONTROLLER_NAMES
csvPatch:
  enabled: true
  csvName: rhcl-operator.v1.3.4
  gatewayControllerNames: "istio.io/gateway-controller,openshift.io/gateway-controller/v1"

# kuadrant-operator-controller-manager defaults to 200Mi request / 300Mi limit in the CSV;
# increase when the controller is OOMKilled during startup or reconciliation.
kuadrantOperator:
  resourcesPatch:
    enabled: true
    requests:
      memory: 3Gi
      cpu: 200m
    limits:
      memory: 5Gi
      cpu: 500m

# bootstrap.sh: enable kuadrant-console-plugin
consolePlugin:
  enabled: true
  name: kuadrant-console-plugin

# bootstrap.sh step 11: WASM shim workaround for disconnected clusters (CONNLINK-805).
# Enable per cluster via cluster.yaml; requires wasmShimImage and protectedRegistry.
disconnected:
  enabled: false
  wasmShimImage: ""
  protectedRegistry: ""
