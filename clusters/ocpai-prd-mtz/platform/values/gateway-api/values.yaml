# External MaaS hostname: maas.apps.ocpai-prd-mtz.<baseDomain>
# Non-cloud: ClusterIP Gateway + passthrough Route. TLS terminates on the
# Gateway using the IngressController wildcard cert (router-certs-default).
disconnected:
  gatewayConfig:
    name: maas-gateway-options
    namespace: openshift-ingress
    serviceType: ClusterIP

ingressCertificate:
  secretName: router-certs-default

gateways:
  maas-default-gateway:
    listeners:
      http:
        hostname: "maas.apps.{{ .Values.global.cluster.name }}.{{ .Values.global.cluster.baseDomain }}"
      https:
        hostname: "maas.apps.{{ .Values.global.cluster.name }}.{{ .Values.global.cluster.baseDomain }}"
        certificate:
          create: false
          secretName: router-certs-default
        tls:
          mode: Terminate
          certificateRefs:
            - group: ""
              kind: Secret
              name: router-certs-default

route:
  create: true
  name: maas-default-gateway
  timeout: 10m
  forwardedHeaders: append
  targetPort: https
  tls:
    termination: passthrough
    insecureEdgeTerminationPolicy: Redirect
