# External MaaS hostname: maas.apps.cluster-6f7dh.6f7dh.sandbox3519.opentlc.com
# TLS terminates on the OpenShift Route (edge, cluster wildcard cert). Do not
# declare a Gateway HTTPS listener without a Secret: the Ingress Operator then
# creates a passthrough Route to :443 and curl fails with SSL_ERROR_SYSCALL.
gateways:
  maas-default-gateway:
    listeners:
      http:
        hostname: "maas.apps.{{ .Values.global.cluster.name }}.{{ .Values.global.cluster.baseDomain }}"
      https: null

route:
  create: true
  name: maas-default-gateway
  timeout: 10m
  forwardedHeaders: append
  tls:
    termination: edge
    insecureEdgeTerminationPolicy: Redirect
