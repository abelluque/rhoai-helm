# ClusterIP + passthrough Route through router-default (the apps wildcard).
# Do not use a public LoadBalancer :80 — https://maas.apps...:443 never
# reaches that ELB and times out. TLS is terminated on the Gateway with the
# IngressController wildcard cert (router-certs-default).
disconnected:
  gatewayConfig:
    name: maas-gateway-options
    namespace: openshift-ingress
    serviceType: ClusterIP

ingressCertificate:
  secretName: router-certs-default

gateways:
  maas-default-gateway:
    listeners:
      http: null
      https:
        hostname: "maas.apps.{{ .Values.global.cluster.name }}.{{ .Values.global.cluster.baseDomain }}"
        port: 443
        protocol: HTTPS
        certificate:
          create: false
          secretName: router-certs-default
        tls:
          mode: Terminate
          certificateRefs:
            - group: ""
              kind: Secret
              name: router-certs-default

route:
  create: true
  name: maas-default-gateway
  timeout: 10m
  forwardedHeaders: append
  targetPort: https
  tls:
    termination: passthrough
    insecureEdgeTerminationPolicy: Redirect
