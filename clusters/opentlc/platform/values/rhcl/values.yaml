# OpenTLC 4.20 catalog may ship RHCL newer than the chart pin (v1.3.4).
# Manual + missing startingCSV leaves patch-rhcl-csv waiting forever.
install-rhcl:
  operators:
    rhcl-operator:
      installPlanApproval: Automatic
      startingCSV: null

csvPatch:
  csvName: ""

# 3Gi controller patch is for OOM on large clusters. Do not block Helm on the
# OpenTLC lab while kuadrant-operator-controller-manager is still coming up.
kuadrantOperator:
  resourcesPatch:
    enabled: false
