# Lab SLM: Granite 3.1 2B on CPU (no NVIDIA). Used to validate MaaS wiring
# (Gateway, ModelRef, Subscription, AuthPolicy, chat completions) without H200s.
# Image: Red Hat AI Inference Server CPU. Workers are m6a.4xlarge (AVX2).
namespace:
  create: true
  name: ai-models

displaynameOverride: "Granite 3.1 2B Instruct (CPU lab)"
fullnameOverride: granite-3-1-2b-instruct

image:
  registry: registry.redhat.io
  # RHAIIS 3.4 renamed the CPU image from rhaiis/ to rhaii/.
  repository: rhaii/vllm-cpu-rhel9
  tag: "3.4.1"

genaiAsset:
  enabled: true
  description: Small Granite instruct model for OpenTLC lab MaaS validation (CPU only).
  useCase: chat

model:
  name: granite-3-1-2b-instruct
  uri: hf://ibm-granite/granite-3.1-2b-instruct
  pvc:
    preload: false
    mode: ReadWriteOnce
    size: 10Gi
  args:
    - --max-model-len=1024
    - --max-num-seqs=1
    - --enforce-eager
    - --dtype=float32

# vLLM 0.18 CPU defaults KV cache to ~50% of node RAM (~201k tokens here) and
# OOMs after loading weights. Cap cache and OpenMP threads to the pod budget.
env:
  VLLM_CPU_KVCACHE_SPACE: "4"
  VLLM_CPU_OMP_THREADS_BIND: "0-3"

replicas: 1

hardwareProfile:
  enabled: true
  name: cpu-platform
  namespace: redhat-ods-applications

# Null GPU keys so Helm does not keep nvidia.com/gpu from chart defaults.
# float32 2B weights are ~8Gi plus KV cache and vLLM overhead; 16Gi OOMKilled
# on m6a.4xlarge (61Gi). Leave headroom for platform pods on the same workers.
resources:
  limits:
    cpu: "8"
    memory: 32Gi
    nvidia.com/gpu: null
  requests:
    cpu: "4"
    memory: 16Gi
    nvidia.com/gpu: null

nodeSelector:
  nvidia.com/gpu.present: null
  workload.rhoai.io/platform: "true"

tolerations: []

huggingface:
  existingSecret: ""

dataScienceConnection:
  create: false

maas:
  enabled: true
  createModelRef: false
